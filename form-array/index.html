<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Array</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="form-array">
         <div class="arrayList">
            <h1>List of all Array</h1>
            <ol id="all-array"></ol>
        </div>
        <div>
            <label for="input-picked-array">Choose Array from list :</label>
            <input type="number" id="input-picked-array">
        </div>
        <div>
            <label for="save-array">Save Array</label>
            <input type="text" id="save-array">
        </div>
        <div class="btn-layout">
            <div><button id="input-btn">Save Array</button></div>
            <div><button id="del-btn">Clear All Array</button></div>
        </div>
        <div>
            <h2>Picked Array</h2>
            <ol id="picked-array"></ol>
        </div>
    </div>
    <!-- Calculator -->
    <div class="calculator-app">
        Ini calculator progress
    </div>
    <script src="index.js"></script>
</body>
</html>
